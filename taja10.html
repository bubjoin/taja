<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>네온 꿀벌 타자: 부스터 모드</title>
<style>
  :root {
    --bg-color: #05050a; --card-bg: #10101e; --text-color: #00f2ff;
    --accent-color: #7000ff; --correct-color: #39ff14; --wrong-color: #ff3131;
    --timer-color: #fce205; --bee-yellow: #ffd700;
    --bee-speed: 1s; /* 기본 비행 속도 */
  }
  body {
    font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: #fff;
    margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
  }
  nav {
    width: 100%; background: #1a1a2e; display: flex; justify-content: center;
    gap: 15px; padding: 12px 0; border-bottom: 2px solid var(--accent-color);
  }
  nav button {
    background: none; border: 1px solid var(--accent-color); color: var(--text-color);
    padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: bold;
  }
  nav button.active { background: var(--accent-color); color: #fff; box-shadow: 0 0 15px var(--accent-color); }

  #bee-track {
    width: 90%; max-width: 850px; height: 80px; background: rgba(255,255,255,0.02);
    border-radius: 40px; margin: 25px 0; position: relative; border: 1px solid #333;
  }
  #hive, #honey-pot { position: absolute; top: 25px; font-size: 28px; z-index: 2; }
  #hive { left: 15px; } #honey-pot { right: 15px; }
  
  #bee {
    position: absolute; left: 60px; top: 15px; font-size: 45px;
    transition: left 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    z-index: 10; filter: drop-shadow(0 0 10px var(--bee-yellow));
    will-change: left, transform;
  }
  #active-line {
    position: absolute; top: 50%; left: 60px; width: 0%;
    height: 4px; background: linear-gradient(90deg, var(--accent-color), var(--text-color));
    box-shadow: 0 0 10px var(--text-color); transition: width 0.3s;
  }

  .container { width: 95%; max-width: 900px; text-align: center; }
  #level-selector { display: none; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .lv-btn { padding: 6px 14px; background: #222; border: 1px solid #444; color: #fff; border-radius: 10px; cursor: pointer; }
  .lv-btn.selected { background: var(--text-color); color: #000; font-weight: bold; }

  #display-box {
    background: var(--card-bg); padding: 40px; border-radius: 20px;
    margin-bottom: 20px; border: 1px solid #333; position: relative;
    box-shadow: 0 15px 35px rgba(0,0,0,0.7);
  }
  .char { font-size: 3rem; font-weight: bold; color: #333; letter-spacing: 12px; transition: color 0.1s; }
  .char.active { color: #fff; text-shadow: 0 0 20px #fff; border-bottom: 5px solid var(--text-color); }
  .char.correct { color: var(--correct-color); }
  .char.wrong { color: var(--wrong-color); background: rgba(255,0,0,0.1); }

  #finger-guide { font-size: 1.4rem; color: var(--timer-color); margin-top: 25px; font-weight: bold; height: 1.8rem; }
  
  .dashboard { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; }
  .stat-card { background: var(--card-bg); padding: 12px 25px; border-radius: 15px; border: 1px solid #444; min-width: 100px; transition: 0.3s; }
  .stat-card.hot { border-color: var(--timer-color); box-shadow: 0 0 20px rgba(252, 226, 5, 0.3); }
  .stat-label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 5px; }
  .stat-val { font-size: 1.8rem; font-weight: bold; }

  #hiddenInput { position: absolute; opacity: 0; pointer-events: none; }
  
  /* 다이나믹 벌 애니메이션 */
  .bumble { animation: bumble var(--bee-speed) infinite alternate ease-in-out; }
  @keyframes bumble { 
    from { transform: rotate(-8deg) scale(1); } 
    to { transform: rotate(8deg) translateY(-10px) scale(1.1); } 
  }
  
  /* 속도가 빠를 때 잔상 효과 */
  .fast-bee { filter: drop-shadow(0 0 15px #fff) drop-shadow(-10px 0 5px var(--accent-color)) !important; }

  #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
  .shake { animation: shake 0.2s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style>
</head>
<body onclick="document.getElementById('hiddenInput').focus()">

<nav>
  <button id="nav-k" onclick="startKindergarten()">🐝 유치원 코스</button>
  <button id="nav-p" onclick="switchMode('practice')">⚙️ 자유 연습</button>
  <button id="nav-g" onclick="switchMode('game')">🏆 타임어택</button>
</nav>

<div class="container">
  <div id="bee-track">
    <div id="hive">🏠</div>
    <div id="active-line"></div>
    <div id="bee" class="bumble">🐝</div>
    <div id="honey-pot">🍯</div>
  </div>

  <div id="level-selector">
    <button class="lv-btn selected" onclick="setLv(1)">Lv.1</button>
    <button class="lv-btn" onclick="setLv(2)">Lv.2</button>
    <button class="lv-btn" onclick="setLv(3)">Lv.3</button>
    <button class="lv-btn" onclick="setLv(4)">Lv.4</button>
    <button class="lv-btn" onclick="setLv(5)">Lv.5</button>
  </div>

  <div class="dashboard">
    <div class="stat-card" id="wpm-card"><span class="stat-label">INSTANT WPM</span><span id="wpm-val" class="stat-val">0</span></div>
    <div class="stat-card"><span class="stat-label">TIME</span><span id="timer-val" class="stat-val">--</span></div>
    <div class="stat-card"><span class="stat-label">ACC</span><span id="acc-val" class="stat-val">0%</span></div>
  </div>

  <div id="display-box">
    <div id="target-text"></div>
    <div id="finger-guide"></div>
  </div>
</div>

<input type="text" id="hiddenInput" autocomplete="off" autofocus>

<div id="overlay">
  <h1 id="res-title">정복 완료!</h1>
  <p id="res-stats" style="font-size: 1.5rem; text-align: center; line-height: 1.8;"></p>
  <button onclick="closeOverlay()" style="padding: 12px 40px; font-size: 1.2rem; cursor: pointer; border-radius: 30px; background: var(--correct-color); color: #000; border: none; font-weight: bold; margin-top: 20px;">다시 시작</button>
</div>

<script>
/* --- 데이터 --- */
const KINDER_COURSE = [
  { p: "f4f", g: "검지: F 위 '4'" }, { p: "f5f", g: "검지: F 위 '5'" },
  { p: "j7j", g: "검지: J 위 '7'" }, { p: "j6j", g: "검지: J 위 '6'" },
  { p: "d3d", g: "중지: D 위 '3'" }, { p: "k8k", g: "중지: K 위 '8'" },
  { p: "s2s", g: "약지: S 위 '2'" }, { p: "l9l", g: "약지: L 위 '9'" },
  { p: "a1a", g: "새끼: A 위 '1'" }, { p: ";0;", g: "새끼: ; 위 '0'" },
  { p: "!@#", g: "Shift 조합: 숫자키 위쪽" }, { p: "$%^", g: "Shift 조합: 중심부" },
  { p: "&*(", g: "Shift 조합: 오른쪽" }, { p: "[]{}", g: "오른쪽 끝 괄호" },
  { p: "<>.,", g: "아래쪽 꺽쇠와 쉼표" }, { p: "/?\\|", g: "최우측 특수기호" }
];
const POOLS = { 1: "0123456789", 2: "!@#$%^&*", 3: "()_-+=[]{};:'\",.<>/?\\|", 4: "0123456789!@#$%^&*()_-+=[]{};:'\",.<>/?\\|", 5: "!@#$%^&*()" };
const FINGER_MAP = { '1':'왼손 새끼', '2':'왼손 약지', '3':'왼손 중지', '4':'왼손 검지', '5':'왼손 검지', '6':'오른손 검지', '7':'오른손 검지', '8':'오른손 중지', '9':'오른손 약지', '0':'오른손 새끼', 'f':'기준점', 'j':'기준점', '!':'Shift+1', '@':'Shift+2', '#':'Shift+3', '$':'Shift+4', '%':'Shift+5', '^':'Shift+6', '&':'Shift+7', '*':'Shift+8', '(':'Shift+9', ')':'Shift+0' };

/* --- 상태 관리 --- */
let mode = ''; let curLv = 1; let kinderIdx = 0; let curIdx = 0; 
let targetStr = ""; let typedCount = 0; let mistakeCount = 0;
let startTime = null; let timer = null;

// 실시간 WPM을 위한 변수
let keyTimes = []; // 최근 입력 시간 저장용 윈도우
let currentWPM = 0;
let lastInputTime = Date.now();

/* --- 초기화 및 모드 전환 --- */
function startKindergarten() {
  mode = 'kinder'; kinderIdx = 0;
  document.getElementById('level-selector').style.display = 'none';
  resetStats(); updateNav('nav-k'); loadKinderStep();
}

function switchMode(newMode) {
  mode = newMode;
  document.getElementById('level-selector').style.display = 'flex';
  resetStats(); updateNav('nav-' + newMode[0]); setLv(curLv);
}

function setLv(lv) {
  curLv = lv;
  document.querySelectorAll('.lv-btn').forEach((btn, idx) => btn.classList.toggle('selected', idx + 1 === lv));
  generateNewSentence();
}

function updateNav(id) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetStats() {
  clearInterval(timer); startTime = null; timer = null;
  typedCount = 0; mistakeCount = 0; curIdx = 0; currentWPM = 0; keyTimes = [];
  document.getElementById('wpm-val').textContent = '0';
  document.getElementById('acc-val').textContent = '0%';
  document.getElementById('timer-val').textContent = (mode === 'game') ? '30' : '--';
  updateBee(0);
}

/* --- 실시간 WPM 계산 로직 (핵심) --- */
function calculateInstantWPM() {
  const now = Date.now();
  const timeSinceLastKey = (now - lastInputTime) / 1000;

  // 타이핑을 멈추면 WPM 서서히 감소 (Decay)
  if (timeSinceLastKey > 0.5) {
    currentWPM = Math.max(0, currentWPM * 0.92); // 초당 약 절반으로 감소
  }

  // 최근 8타 간의 간격으로 실시간 WPM 계산
  if (keyTimes.length > 1) {
    const duration = (keyTimes[keyTimes.length - 1] - keyTimes[0]) / 60000; // 분 단위
    const instant = (keyTimes.length / 5) / duration;
    // 너무 튀지 않게 보간법 사용
    currentWPM = (currentWPM * 0.6) + (instant * 0.4);
  }

  const displayWPM = Math.round(currentWPM);
  document.getElementById('wpm-val').textContent = displayWPM;

  // 시각적 효과 업데이트
  const bee = document.getElementById('bee');
  const wpmCard = document.getElementById('wpm-card');
  
  // WPM에 따른 벌 애니메이션 속도 조절
  let speed = 1.0 - (displayWPM / 500); // 0~500 WPM 기준
  speed = Math.max(0.1, speed); // 최소 0.1초
  document.documentElement.style.setProperty('--bee-speed', speed + 's');

  // 고속 주행 시 효과
  if (displayWPM > 200) {
    bee.classList.add('fast-bee');
    wpmCard.classList.add('hot');
  } else {
    bee.classList.remove('fast-bee');
    wpmCard.classList.remove('hot');
  }
}

// 0.1초마다 WPM 상태 업데이트 (멈췄을 때 떨어지는 효과를 위해)
setInterval(calculateInstantWPM, 100);

/* --- 게임 로직 --- */
function loadKinderStep() {
  targetStr = KINDER_COURSE[kinderIdx].p;
  curIdx = 0; renderText();
}

function generateNewSentence() {
  const pool = POOLS[curLv];
  targetStr = "";
  for(let i=0; i<10; i++) targetStr += pool[Math.floor(Math.random()*pool.length)];
  curIdx = 0; renderText();
}

function renderText() {
  const container = document.getElementById('target-text');
  container.innerHTML = '';
  [...targetStr].forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c; s.className = 'char';
    if(i === curIdx) s.classList.add('active');
    if(i < curIdx) s.classList.add('correct');
    container.appendChild(s);
  });
  
  const guide = document.getElementById('finger-guide');
  if(mode === 'kinder') {
    const char = targetStr[curIdx];
    guide.textContent = `👉 [ ${char} ] : ${FINGER_MAP[char] || '손가락'} (${kinderIdx + 1}/${KINDER_COURSE.length})`;
  } else { guide.textContent = "눈은 화면에, 손은 홈 자리에!"; }
  updateBee();
}

function updateBee() {
  let progress = (mode === 'kinder') 
    ? (kinderIdx + (curIdx / targetStr.length)) / KINDER_COURSE.length 
    : (curIdx / targetStr.length);
  const trackWidth = document.getElementById('bee-track').offsetWidth - 120;
  document.getElementById('bee').style.left = (60 + trackWidth * progress) + 'px';
  document.getElementById('active-line').style.width = (progress * 100) + '%';
}

/* --- 입력 처리 --- */
document.getElementById('hiddenInput').addEventListener('input', (e) => {
  const char = e.target.value.slice(-1);
  e.target.value = "";
  
  const now = Date.now();
  lastInputTime = now;
  if(!startTime) startTime = now;
  if(mode === 'game' && !timer) startTimer();

  if(char === targetStr[curIdx]) {
    // 맞았을 때만 WPM 샘플에 추가
    keyTimes.push(now);
    if(keyTimes.length > 8) keyTimes.shift(); // 최근 8타만 유지
    curIdx++; typedCount++;
  } else {
    mistakeCount++;
    document.getElementById('display-box').classList.add('shake');
    setTimeout(()=>document.getElementById('display-box').classList.remove('shake'), 200);
  }

  const acc = typedCount === 0 ? 0 : Math.round(((typedCount - mistakeCount) / typedCount) * 100);
  document.getElementById('acc-val').textContent = Math.max(0, acc) + "%";

  if(curIdx >= targetStr.length) {
    if(mode === 'kinder') {
      kinderIdx++;
      if(kinderIdx >= KINDER_COURSE.length) setTimeout(showResult, 400);
      else setTimeout(loadKinderStep, 100);
    } else {
      setTimeout(generateNewSentence, 100);
    }
  } else { renderText(); }
});

function startTimer() {
  let left = 30;
  timer = setInterval(() => {
    left--; document.getElementById('timer-val').textContent = left;
    if(left <= 0) { clearInterval(timer); showResult(); }
  }, 1000);
}

function showResult() {
  document.getElementById('overlay').style.display = 'flex';
  const acc = document.getElementById('acc-val').textContent;
  document.getElementById('res-stats').innerHTML = `최고 속도 유지에 도전해보세요!<br>정확도: ${acc}<br>실수: ${mistakeCount}번`;
}

function closeOverlay() {
  document.getElementById('overlay').style.display = 'none';
  if(mode === 'kinder') startKindergarten(); else resetStats();
}

startKindergarten();
</script>
</body>
</html>
