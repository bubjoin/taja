<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>네온 꿀벌 타자: 마스터 로드</title>
<style>
  :root {
    --bg-color: #0d0d16; --card-bg: #161625; --text-color: #00f2ff;
    --accent-color: #7000ff; --correct-color: #39ff14; --wrong-color: #ff3131;
    --timer-color: #fce205; --bee-yellow: #ffd700;
  }
  body {
    font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: #fff;
    margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }

  nav {
    width: 100%; background: #1a1a2e; display: flex; justify-content: center;
    gap: 20px; padding: 15px 0; border-bottom: 2px solid var(--accent-color);
  }
  nav button {
    background: none; border: 1px solid var(--accent-color); color: var(--text-color);
    padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s;
  }
  nav button.active { background: var(--accent-color); color: #fff; box-shadow: 0 0 15px var(--accent-color); }

  /* 꿀벌 트랙 - 이제 전체 진행도를 나타냅니다 */
  #bee-track {
    width: 90%; max-width: 800px; height: 80px; background: rgba(255,255,255,0.03);
    border-radius: 40px; margin: 30px 0; position: relative; border: 2px solid #222;
  }
  #hive { position: absolute; left: 15px; top: 25px; font-size: 30px; }
  #honey-pot { position: absolute; right: 15px; top: 25px; font-size: 30px; }
  #bee {
    position: absolute; left: 60px; top: 15px; font-size: 40px;
    transition: left 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95);
    z-index: 10; filter: drop-shadow(0 0 8px var(--bee-yellow));
  }
  .progress-line {
    position: absolute; top: 50%; left: 60px; right: 60px;
    height: 4px; background: #222; border-radius: 2px;
  }
  #active-line {
    position: absolute; top: 50%; left: 60px; width: 0%;
    height: 4px; background: linear-gradient(90deg, var(--accent-color), var(--text-color));
    box-shadow: 0 0 10px var(--text-color); transition: width 0.6s;
  }

  .container { width: 90%; max-width: 850px; text-align: center; }
  
  #display-box {
    background: var(--card-bg); padding: 40px; border-radius: 20px;
    margin-bottom: 20px; border: 1px solid #333; position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .char { font-size: 3.5rem; font-weight: bold; color: #333; letter-spacing: 12px; }
  .char.active { color: #fff; text-shadow: 0 0 20px #fff; border-bottom: 5px solid var(--text-color); }
  .char.correct { color: var(--correct-color); text-shadow: 0 0 10px var(--correct-color); }
  .char.wrong { color: var(--wrong-color); background: rgba(255,0,0,0.1); }

  #finger-guide { font-size: 1.4rem; color: var(--timer-color); margin-top: 25px; font-weight: bold; }
  
  .dashboard { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
  .stat-card { background: var(--card-bg); padding: 10px 20px; border-radius: 12px; border: 1px solid #444; min-width: 100px; }
  .stat-label { font-size: 0.75rem; color: #888; display: block; }
  .stat-val { font-size: 1.4rem; font-weight: bold; }

  #hiddenInput { position: absolute; opacity: 0; }

  .status-msg { margin-bottom: 10px; font-size: 1.1rem; color: var(--text-color); }

  #overlay {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  
  .bumble { animation: bumble 1s infinite alternate ease-in-out; }
  @keyframes bumble { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(5deg) translateY(-8px); } }
  .shake { animation: shake 0.2s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style>
</head>
<body onclick="document.getElementById('hiddenInput').focus()">

<nav>
  <button id="nav-k" onclick="startKindergarten()">🐝 유치원 정복 코스</button>
  <button id="nav-p" onclick="switchMode('practice')">⚙️ 자유 연습</button>
  <button id="nav-g" onclick="switchMode('game')">🏆 타임어택 게임</button>
</nav>

<div class="container">
  <div id="bee-track">
    <div id="hive">🏠</div>
    <div class="progress-line"></div>
    <div id="active-line"></div>
    <div id="bee" class="bumble">🐝</div>
    <div id="honey-pot">🍯</div>
  </div>

  <div class="status-msg" id="status-msg">모드를 선택해 주세요!</div>

  <div class="dashboard">
    <div class="stat-card"><span class="stat-label">TIME</span><span id="timer-val" class="stat-val">--</span></div>
    <div class="stat-card"><span class="stat-label">WPM</span><span id="wpm-val" class="stat-val">0</span></div>
    <div class="stat-card"><span class="stat-label">ACC</span><span id="acc-val" class="stat-val">0%</span></div>
  </div>

  <div id="display-box">
    <div id="target-text"></div>
    <div id="finger-guide"></div>
  </div>
</div>

<input type="text" id="hiddenInput" autocomplete="off" autofocus>

<div id="overlay">
  <h1 id="res-title">코스 완료!</h1>
  <p id="res-stats" style="font-size: 1.5rem; text-align: center; line-height: 1.6;"></p>
  <button onclick="location.reload()" style="padding: 12px 40px; font-size: 1.2rem; cursor: pointer; border-radius: 30px; background: var(--correct-color); color: #000; border: none; font-weight: bold;">한 번 더 하기</button>
</div>

<script>
/* --- 데이터 설정 --- */
// 유치원 모드 전체 코스 (순서대로 진행)
const KINDER_COURSE = [
  { p: "f4f", g: "검지 훈련: F에서 11시 방향 '4'" },
  { p: "f5f", g: "검지 훈련: F에서 12시 방향 '5'" },
  { p: "j7j", g: "검지 훈련: J에서 12시 방향 '7'" },
  { p: "j6j", g: "검지 훈련: J에서 1시 방향 '6'" },
  { p: "d3d", g: "중지 훈련: D에서 바로 위 '3'" },
  { p: "k8k", g: "중지 훈련: K에서 바로 위 '8'" },
  { p: "s2s", g: "약지 훈련: S에서 바로 위 '2'" },
  { p: "l9l", g: "약지 훈련: L에서 바로 위 '9'" },
  { p: "a1a", g: "새끼 훈련: A에서 바로 위 '1'" },
  { p: ";0;", g: "새끼 훈련: ;에서 바로 위 '0'" },
  { p: "12345", g: "통합: 왼손 숫자 나란히" },
  { p: "67890", g: "통합: 오른손 숫자 나란히" }
];

const POOLS = { 1: "0123456789", 2: "!@#$%^&*", 3: "()_-+=[]{};:'\",.<>/?\\|", 4: "0123456789!@#$%^&*()_-+=[]{};:'\",.<>/?\\|", 5: "!@#$%^&*()" };
const FINGER_MAP = { '1':'왼손 새끼', '2':'왼손 약지', '3':'왼손 중지', '4':'왼손 검지', '5':'왼손 검지', '6':'오른손 검지', '7':'오른손 검지', '8':'오른손 중지', '9':'오른손 약지', '0':'오른손 새끼', 'f':'왼손 검지', 'j':'오른손 검지', 'd':'왼손 중지', 'k':'오른손 중지', 's':'왼손 약지', 'l':'오른손 약지', 'a':'왼손 새끼', ';':'오른손 새끼' };

/* --- 상태 --- */
let mode = ''; 
let kinderIdx = 0; // 유치원 코스 진행 번호
let curIdx = 0; 
let targetStr = "";
let typedCount = 0; let mistakeCount = 0; let startTime = null; let timer = null;

/* --- 모드 전환 --- */
function startKindergarten() {
  mode = 'kinder';
  kinderIdx = 0;
  resetStats();
  updateNav('nav-k');
  document.getElementById('status-msg').textContent = "🐝 꿀벌과 함께하는 손가락 자리 익히기 (총 12단계)";
  loadKinderStep();
}

function switchMode(newMode) {
  mode = newMode;
  resetStats();
  updateNav('nav-' + newMode[0]);
  document.getElementById('status-msg').textContent = newMode === 'practice' ? "⚙️ 원하는 레벨을 무한 연습하세요!" : "🏆 30초 동안 최고 기록에 도전하세요!";
  generateNewSentence();
}

function updateNav(id) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetStats() {
  clearInterval(timer); startTime = null; typedCount = 0; mistakeCount = 0; curIdx = 0;
  document.getElementById('wpm-val').textContent = '0';
  document.getElementById('acc-val').textContent = '0%';
  document.getElementById('timer-val').textContent = (mode === 'game') ? '30' : '--';
}

/* --- 핵심 로직: 꿀벌 이동 & 텍스트 출력 --- */
function loadKinderStep() {
  const step = KINDER_COURSE[kinderIdx];
  targetStr = step.p;
  curIdx = 0;
  renderText();
}

function generateNewSentence() {
  const pool = POOLS[1]; // 기본 숫자 연습
  targetStr = "";
  for(let i=0; i<10; i++) targetStr += pool[Math.floor(Math.random()*pool.length)];
  curIdx = 0;
  renderText();
}

function renderText() {
  const container = document.getElementById('target-text');
  container.innerHTML = '';
  [...targetStr].forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c; s.className = 'char';
    if(i === curIdx) s.classList.add('active');
    if(i < curIdx) s.classList.add('correct');
    container.appendChild(s);
  });
  
  const guide = document.getElementById('finger-guide');
  if(mode === 'kinder') {
    const char = targetStr[curIdx].toLowerCase();
    guide.textContent = `👉 [ ${char.toUpperCase()} ] 키를 ${FINGER_MAP[char] || '손가락'}으로 누르세요! (${kinderIdx + 1}/12)`;
  } else { guide.textContent = "눈은 화면을 보며 손끝의 감각에 집중하세요!"; }

  updateBeePosition();
}

function updateBeePosition() {
  let progress = 0;
  if (mode === 'kinder') {
    // 유치원 모드: (지나온 코스 수 + 현재 문장 내 진행도) / 전체 코스 수
    progress = (kinderIdx + (curIdx / targetStr.length)) / KINDER_COURSE.length;
  } else {
    // 연습/게임: 현재 문장 내 진행도
    progress = curIdx / targetStr.length;
  }

  const bee = document.getElementById('bee');
  const activeLine = document.getElementById('active-line');
  const trackWidth = document.getElementById('bee-track').offsetWidth - 120;
  
  const movePos = 60 + (trackWidth * progress);
  bee.style.left = movePos + 'px';
  activeLine.style.width = (progress * 100) + '%';
  
  if(progress >= 0.99) bee.style.transform = 'scale(1.4) rotate(10deg)';
  else bee.style.transform = 'scale(1) rotate(0deg)';
}

/* --- 입력 처리 --- */
document.getElementById('hiddenInput').addEventListener('input', (e) => {
  const char = e.target.value.slice(-1).toLowerCase();
  e.target.value = "";
  
  if(!startTime) startTime = Date.now();
  if(mode === 'game' && !timer) startTimer();

  if(char === targetStr[curIdx].toLowerCase()) {
    curIdx++; typedCount++;
  } else {
    mistakeCount++;
    document.getElementById('display-box').classList.add('shake');
    setTimeout(()=>document.getElementById('display-box').classList.remove('shake'), 200);
  }

  // 통계 계산
  const acc = Math.round(((typedCount - mistakeCount) / typedCount) * 100);
  document.getElementById('acc-val').textContent = Math.max(0, acc) + "%";
  const elapsed = (Date.now() - startTime) / 60000;
  const wpm = Math.round((typedCount / 5) / elapsed);
  document.getElementById('wpm-val').textContent = isFinite(wpm) ? wpm : 0;

  // 문장 종료 시
  if(curIdx >= targetStr.length) {
    if(mode === 'kinder') {
      kinderIdx++;
      if(kinderIdx >= KINDER_COURSE.length) {
        updateBeePosition();
        setTimeout(showFinalResult, 500);
      } else {
        setTimeout(loadKinderStep, 100);
      }
    } else {
      setTimeout(generateNewSentence, 100);
    }
  } else {
    renderText();
  }
});

function startTimer() {
  let left = 30;
  timer = setInterval(() => {
    left--;
    document.getElementById('timer-val').textContent = left;
    if(left <= 0) { clearInterval(timer); showFinalResult(); }
  }, 1000);
}

function showFinalResult() {
  const wpm = document.getElementById('wpm-val').textContent;
  const acc = document.getElementById('acc-val').textContent;
  document.getElementById('overlay').style.display = 'flex';
  
  let msg = mode === 'kinder' ? "🐝 모든 꽃을 방문하여 꿀을 가득 채웠습니다!" : "🏆 기록 측정 완료!";
  document.getElementById('res-stats').innerHTML = `${msg}<br><br>평균 속도: ${wpm} WPM<br>정확도: ${acc}<br>실수: ${mistakeCount}번`;
}

// 시작은 유치원 모드로!
startKindergarten();
</script>
</body>
</html>
