<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>허니타이핑: 울트라 에디션</title>
<style>
  :root {
    --bg-color: #05050a; --card-bg: #10101e; --text-color: #00f2ff;
    --accent-color: #7000ff; --correct-color: #39ff14; --wrong-color: #ff3131;
    --timer-color: #fce205; --bee-yellow: #ffd700;
    --bee-speed: 1s;
  }
  body {
    font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: #fff;
    margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
  }
  
  /* 네비게이션 확장 */
  nav {
    width: 100%; background: #1a1a2e; display: flex; justify-content: center;
    gap: 10px; padding: 15px 0; border-bottom: 2px solid var(--accent-color); flex-wrap: wrap;
  }
  nav button {
    background: none; border: 1px solid var(--accent-color); color: var(--text-color);
    padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 0.9rem;
  }
  nav button.active { background: var(--accent-color); color: #fff; box-shadow: 0 0 15px var(--accent-color); }

  /* 꿀벌 트랙 */
  #bee-track {
    width: 90%; max-width: 850px; height: 70px; background: rgba(255,255,255,0.02);
    border-radius: 40px; margin: 20px 0; position: relative; border: 2px solid #222; overflow: hidden;
  }
  #hive, #honey-pot { position: absolute; top: 18px; font-size: 28px; z-index: 5; }
  #hive { left: 20px; } #honey-pot { right: 20px; }
  #bee {
    position: absolute; left: 60px; top: 12px; font-size: 38px;
    transition: left 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    z-index: 10; filter: drop-shadow(0 0 10px var(--bee-yellow));
  }
  #active-line {
    position: absolute; top: 0; left: 0; width: 0%; height: 100%;
    background: linear-gradient(90deg, rgba(112,0,255,0.2), rgba(0,242,255,0.2));
    border-right: 3px solid var(--text-color); transition: width 0.4s;
  }

  .container { width: 95%; max-width: 900px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  
  /* 셀렉터 바 가독성 개선 */
  .selector-bar { display: none; justify-content: center; gap: 8px; margin-bottom: 25px; animation: fadeIn 0.3s; flex-wrap: wrap; }
  .sel-btn {
    padding: 6px 12px; background: #222; border: 1px solid #444; color: #ccc;
    border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 0.8rem;
  }
  .sel-btn.active { background: var(--text-color); color: #000; font-weight: bold; border-color: var(--text-color); box-shadow: 0 0 10px var(--text-color); }

  .dashboard { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
  .stat-card { 
    background: var(--card-bg); padding: 15px 30px; border-radius: 18px; 
    border: 1px solid #333; min-width: 120px; display: flex; flex-direction: column; gap: 8px;
  }
  .stat-label { font-size: 0.8rem; color: #888; font-weight: bold; letter-spacing: 1px; }
  .stat-val { font-size: 2rem; font-weight: bold; color: #fff; }

  #collection-shelf { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; min-height: 40px; padding: 10px; width: 100%; }
  .honey-mark { font-size: 24px; filter: drop-shadow(0 0 5px orange); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

  #display-box {
    width: 100%; background: var(--card-bg); padding: 50px 40px; border-radius: 25px;
    margin-bottom: 20px; border: 1px solid #333; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
  }
  .char { font-size: 3.2rem; font-weight: bold; color: #222; letter-spacing: 12px; transition: 0.1s; }
  .char.active { color: #fff; text-shadow: 0 0 25px #fff; border-bottom: 5px solid var(--text-color); }
  .char.correct { color: var(--correct-color); }
  .char.wrong { color: var(--wrong-color); background: rgba(255,0,0,0.15); border-radius: 8px; }

  #finger-guide { font-size: 1.4rem; color: var(--timer-color); margin-top: 30px; font-weight: bold; height: 2rem; }

  #celebration-zone {
    width: 100%; max-width: 850px; margin-top: 10px; padding: 25px;
    background: linear-gradient(180deg, rgba(57, 255, 20, 0.1) 0%, rgba(0,0,0,0) 100%);
    border-radius: 20px; border: 1px solid rgba(57, 255, 20, 0.3);
    display: none; animation: slideUp 0.4s ease-out;
  }
  .garden-title { font-size: 1.8rem; color: var(--correct-color); margin-bottom: 12px; font-weight: bold; text-shadow: 0 0 10px var(--correct-color); }
  .garden-bee { font-size: 45px; animation: dance 0.6s infinite alternate; display: inline-block; }

  @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dance { from { transform: scale(1) rotate(-15deg); } to { transform: scale(1.3) rotate(15deg); } }
  #hiddenInput { position: absolute; opacity: 0; pointer-events: none; }
  .bumble { animation: bumble var(--bee-speed) infinite alternate ease-in-out; }
  @keyframes bumble { from { transform: rotate(-5deg); } to { transform: rotate(5deg) translateY(-5px); } }
  .fast-bee { filter: drop-shadow(0 0 20px #fff) drop-shadow(-15px 0 10px var(--accent-color)) !important; }
  .shake { animation: shake 0.2s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style>
</head>
<body onclick="document.getElementById('hiddenInput').focus()">

<nav>
  <button id="nav-alpha" onclick="switchCategory('alphabet')">🔤 알파벳</button>
  <button id="nav-symbol" onclick="switchCategory('symbol')">🔢 숫자&기호</button>
  <button id="nav-numpad" onclick="switchCategory('numpad')">⌨️ 숫자패드</button>
  <button id="nav-game" onclick="switchMode('game')">🏆 타임어택</button>
</nav>

<div class="container">
  <div id="bee-track">
    <div id="hive">🏠</div>
    <div id="active-line"></div>
    <div id="bee" class="bumble">🐝</div>
    <div id="honey-pot">🍯</div>
  </div>

  <div id="alpha-selector" class="selector-bar">
    <button class="sel-btn active" onclick="setGroup('alpha-home')">Home Row</button>
    <button class="sel-btn" onclick="setGroup('alpha-top')">Top Row</button>
    <button class="sel-btn" onclick="setGroup('alpha-bottom')">Bottom Row</button>
    <button class="sel-btn" onclick="setGroup('alpha-all')">Full Alphabet</button>
  </div>

  <div id="symbol-selector" class="selector-bar">
    <button class="sel-btn active" onclick="setGroup('symbol-all')">🏁 전체 코스</button>
    <button class="sel-btn" onclick="setGroup('symbol-index')">☝️ 검지</button>
    <button class="sel-btn" onclick="setGroup('symbol-shift')">⌨️ Shift 기호</button>
  </div>

  <div id="numpad-selector" class="selector-bar">
    <button class="sel-btn active" onclick="setGroup('num-mid')">4-5-6 (Home)</button>
    <button class="sel-btn" onclick="setGroup('num-top')">7-8-9</button>
    <button class="sel-btn" onclick="setGroup('num-bot')">1-2-3</button>
    <button class="sel-btn" onclick="setGroup('num-all')">Full Numpad</button>
  </div>

  <div class="dashboard">
    <div class="stat-card" id="wpm-card"><span class="stat-label">REAL-TIME WPM</span><span id="wpm-val" class="stat-val">0</span></div>
    <div class="stat-card"><span class="stat-label">TIME</span><span id="timer-val" class="stat-val">--</span></div>
    <div class="stat-card"><span class="stat-label">ACCURACY</span><span id="acc-val" class="stat-val">0%</span></div>
  </div>

  <div id="collection-shelf"></div>

  <div id="display-box">
    <div id="target-text"></div>
    <div id="finger-guide"></div>
  </div>

  <div id="celebration-zone">
    <div class="garden-title">🍯 달콤한 꿀 수집 완료! 🍯</div>
    <div style="font-size:1.3rem; margin-bottom:15px;">아무 키나 누르면 다음 비행을 시작합니다</div>
    <div style="display:flex; justify-content:center; align-items:center; gap:30px;">
      <span class="garden-bee">🐝</span>
      <div id="garden-stats" style="font-size:1.4rem; font-weight:bold;"></div>
      <span class="garden-bee" style="animation-delay: 0.3s;">🐝</span>
    </div>
  </div>
</div>

<input type="text" id="hiddenInput" autocomplete="off" autofocus>

<script>
/* --- 확장된 데이터 세트 --- */
const MASTER_DATA = {
  // 알파벳
  'alpha-home': [{p: "asdfghjkl;", g: "Home Row: 기본 자리 연습"}],
  'alpha-top': [{p: "qwertyuiop", g: "Top Row: 상단 열 연습"}],
  'alpha-bottom': [{p: "zxcvbnm,./", g: "Bottom Row: 하단 열 연습"}],
  'alpha-all': [{p: "the quick brown fox jumps over the lazy dog", g: "Full Alphabet: 팬그램 연습"}],
  
  // 숫자&기호
  'symbol-all': [{p: "f4f5 j7j6 d3k8 s2l9 a1;0", g: "전체: 기준점 이동 훈련"}],
  'symbol-index': [{p: "f4f f5f j7j j6j", g: "검지: F-J 기준 이동"}],
  'symbol-shift': [{p: "!@#$%^&*()", g: "Shift 조합 기호"}],

  // 숫자패드 (10-Key)
  'num-mid': [{p: "456456", g: "Numpad Home: 중지 5 기준"}],
  'num-top': [{p: "789789", g: "Numpad Top: 7, 8, 9"}],
  'num-bot': [{p: "123123", g: "Numpad Bottom: 1, 2, 3"}],
  'num-all': [{p: "7894561230", g: "Full Numpad: 전체 숫자 패드"}]
};

// 손가락 맵 확장
const FINGER_MAP = {
  'q':'왼손 새끼', 'a':'왼손 새끼', 'z':'왼손 새끼', '1':'왼손 새끼',
  'w':'왼손 약지', 's':'왼손 약지', 'x':'왼손 약지', '2':'왼손 약지',
  'e':'왼손 중지', 'd':'왼손 중지', 'c':'왼손 중지', '3':'왼손 중지',
  'r':'왼손 검지', 'f':'왼손 검지', 'v':'왼손 검지', '4':'왼손 검지', 't':'왼손 검지', 'g':'왼손 검지', 'b':'왼손 검지', '5':'왼손 검지',
  'y':'오른손 검지', 'h':'오른손 검지', 'n':'오른손 검지', '6':'오른손 검지', 'u':'오른손 검지', 'j':'오른손 검지', 'm':'오른손 검지', '7':'오른손 검지',
  'i':'오른손 중지', 'k':'오른손 중지', ',':'오른손 중지', '8':'오른손 중지',
  'o':'오른손 약지', 'l':'오른손 약지', '.':'오른손 약지', '9':'오른손 약지',
  'p':'오른손 새끼', ';':'오른손 새끼', '/':'오른손 새끼', '0':'오른손 새끼', "'":'오른손 새끼',
  ' ':'엄지'
};

/* --- 상태 관리 --- */
let category = 'alphabet';
let mode = 'practice';
let curIdx = 0;
let targetStr = "";
let currentPatterns = [];
let patternIdx = 0;
let typedCount = 0; let mistakeCount = 0; let startTime = null; let timer = null;
let keyTimes = []; let currentWPM = 0; let lastInputTime = Date.now();
let isCelebration = false;

/* --- 모드 및 카테고리 전환 --- */
function switchCategory(cat) {
  category = cat;
  mode = 'practice';
  hideCelebration();
  resetStats();
  
  // UI 업데이트
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + cat).classList.add('active');
  
  document.querySelectorAll('.selector-bar').forEach(bar => bar.style.display = 'none');
  document.getElementById(cat + '-selector').style.display = 'flex';
  
  // 기본 그룹 설정
  const defaultGroup = cat === 'alphabet' ? 'alpha-home' : (cat === 'symbol' ? 'symbol-all' : 'num-mid');
  setGroup(defaultGroup);
}

function switchMode(m) {
  if (m === 'game') {
    mode = 'game';
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-game').classList.add('active');
    setGroup('alpha-all'); // 게임은 랜덤 문장으로 시작
    resetStats();
  }
}

function setGroup(groupId) {
  currentPatterns = MASTER_DATA[groupId];
  patternIdx = 0;
  
  // 버튼 활성화 표시
  document.querySelectorAll('.sel-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${groupId}'`));
  });
  
  loadNextPattern();
}

function resetStats() {
  clearInterval(timer); startTime = null; timer = null;
  typedCount = 0; mistakeCount = 0; curIdx = 0; currentWPM = 0; keyTimes = [];
  document.getElementById('wpm-val').textContent = '0';
  document.getElementById('acc-val').textContent = '0%';
  document.getElementById('timer-val').textContent = (mode === 'game') ? '30' : '--';
}

/* --- 메인 엔진 --- */
function updateWPM() {
  const now = Date.now();
  if (now - lastInputTime > 500) currentWPM *= 0.94;
  if (keyTimes.length > 1) {
    const dur = (keyTimes[keyTimes.length - 1] - keyTimes[0]) / 60000;
    const instant = (keyTimes.length / 5) / dur;
    currentWPM = (currentWPM * 0.7) + (instant * 0.3);
  }
  const dWPM = Math.round(currentWPM);
  document.getElementById('wpm-val').textContent = dWPM;
  document.documentElement.style.setProperty('--bee-speed', Math.max(0.1, 1.0 - (dWPM / 500)) + 's');
  document.getElementById('bee').classList.toggle('fast-bee', dWPM > 200);
}
setInterval(updateWPM, 100);

function loadNextPattern() {
  targetStr = currentPatterns[patternIdx].p;
  curIdx = 0;
  renderText();
}

function renderText() {
  const container = document.getElementById('target-text');
  container.innerHTML = '';
  [...targetStr].forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c; s.className = 'char';
    if(i === curIdx) s.classList.add('active');
    if(i < curIdx) s.classList.add('correct');
    container.appendChild(s);
  });
  const guide = document.getElementById('finger-guide');
  const char = targetStr[curIdx].toLowerCase();
  guide.textContent = FINGER_MAP[char] ? `👉 [ ${char.toUpperCase()} ] : ${FINGER_MAP[char]}` : "집중하세요!";
  updateBee();
}

function updateBee() {
  let prog = (curIdx / targetStr.length);
  prog = Math.min(1, Math.max(0, prog));
  const trackW = document.getElementById('bee-track').offsetWidth - 120;
  document.getElementById('bee').style.left = (60 + trackW * prog) + 'px';
  document.getElementById('active-line').style.width = (prog * 100) + '%';
}

function addHoneyMark() {
  const shelf = document.getElementById('collection-shelf');
  const jar = document.createElement('span');
  jar.className = 'honey-mark'; jar.textContent = '🍯';
  shelf.appendChild(jar);
}

function showCelebration() {
  isCelebration = true;
  addHoneyMark();
  const zone = document.getElementById('celebration-zone');
  const stats = document.getElementById('garden-stats');
  stats.innerHTML = `정확도: ${document.getElementById('acc-val').textContent} | 속도: ${document.getElementById('wpm-val').textContent} WPM`;
  zone.style.display = 'block';
  document.getElementById('display-box').style.opacity = '0.3';
}

function hideCelebration() {
  isCelebration = false;
  document.getElementById('celebration-zone').style.display = 'none';
  document.getElementById('display-box').style.opacity = '1';
}

/* --- 입력 이벤트 --- */
document.getElementById('hiddenInput').addEventListener('input', (e) => {
  if (isCelebration) {
    e.target.value = "";
    hideCelebration();
    resetStats();
    loadNextPattern();
    return;
  }

  const char = e.target.value.slice(-1);
  e.target.value = "";
  const now = Date.now();
  lastInputTime = now;
  if(!startTime) startTime = now;
  if(mode === 'game' && !timer) startTimer();

  if(char.toLowerCase() === targetStr[curIdx].toLowerCase()) {
    keyTimes.push(now);
    if(keyTimes.length > 8) keyTimes.shift();
    curIdx++; typedCount++;
  } else {
    mistakeCount++;
    document.getElementById('display-box').classList.add('shake');
    setTimeout(()=>document.getElementById('display-box').classList.remove('shake'), 200);
  }

  const acc = typedCount === 0 ? 0 : Math.round(((typedCount - mistakeCount) / typedCount) * 100);
  document.getElementById('acc-val').textContent = acc + "%";

  if(curIdx >= targetStr.length) {
    updateBee();
    if (mode === 'game') {
        // 게임 모드면 계속 다음 패턴 생성 (예시로 같은 데이터 반복)
        loadNextPattern();
    } else {
        showCelebration();
    }
  } else { renderText(); }
});

function startTimer() {
  let left = 30;
  timer = setInterval(() => {
    left--; document.getElementById('timer-val').textContent = left;
    if(left <= 0) { clearInterval(timer); showCelebration(); }
  }, 1000);
}

// 초기 모드 실행
switchCategory('alphabet');
</script>
</body>
</html>
